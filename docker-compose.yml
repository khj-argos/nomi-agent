services:
  platform:
    build:
      context: .
      dockerfile: packages/platform/Dockerfile
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
    image: nanoclaw-platform:latest
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      - ORCHESTRATOR_URL=http://orchestrator:4001
    depends_on:
      orchestrator:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nanoclaw
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  orchestrator:
    build:
      context: .
      dockerfile: packages/orchestrator/Dockerfile
    image: nanoclaw-orchestrator:latest
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=4001
      - ENGINE_IMAGE_URI=nanoclaw-agent:latest
      - DATA_ROOT=${DATA_ROOT:-/data/nanoclaw-instances}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_ROOT:-/data/nanoclaw-instances}:${DATA_ROOT:-/data/nanoclaw-instances}
    restart: unless-stopped
    networks:
      - nanoclaw
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nanoclaw:
    driver: bridge
